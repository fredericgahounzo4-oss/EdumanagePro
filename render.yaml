services:
  # ----------------------------------------------------------------------
  # Backend Django (API REST) — base de données Neon (Postgres externe),
  # pas de service "databases" Render ici : DATABASE_URL est renseigné
  # manuellement avec la chaîne de connexion Neon (voir README, section Neon).
  # ----------------------------------------------------------------------
  - type: web
    name: edumanage-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn edumanage.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      # À définir manuellement avec la chaîne de connexion Neon
      # (Dashboard Neon → Connection string → mode "Pooled connection") :
      - key: DATABASE_URL
        sync: false
      # À définir manuellement après le premier déploiement, une fois l'URL
      # du frontend connue (voir le README à la racine du dépôt) :
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  # ----------------------------------------------------------------------
  # Frontend React (site statique, build Vite)
  # ----------------------------------------------------------------------
  - type: web
    name: edumanage-frontend
    runtime: static
    rootDir: ecole-platform
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      # À définir manuellement après le premier déploiement du backend,
      # avec son URL suivie de /api (voir le README) :
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
